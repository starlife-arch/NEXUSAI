<html lang="en">

<meta charset="UTF-8">

<title>NexusAI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-tertiary: #1a1a2e;
  --bg-card: #12121a; --bg-input: #1a1a2e; --bg-hover: rgba(124,58,237,0.1);
  --bg-active: rgba(124,58,237,0.2); --text-primary: #ffffff; --text-secondary: #9ca3af;
  --text-subtle: #6b7280; --border-color: rgba(255,255,255,0.05);
  --card-border: rgba(255,255,255,0.05); --glow-border: rgba(124,58,237,0.3);
  --glow-shadow: rgba(124,58,237,0.1); --scrollbar-track: #1a1a2e;
  --scrollbar-thumb: #7c3aed; --modal-bg: #12121a; --modal-border: rgba(255,255,255,0.1);
  --badge-bg: rgba(255,255,255,0.05); --stat-bg: rgba(124,58,237,0.05);
}
body.light {
  --bg-primary: #f8f9fc; --bg-secondary: #ffffff; --bg-tertiary: #f1f3f9;
  --bg-card: #ffffff; --bg-input: #f1f3f9; --bg-hover: rgba(124,58,237,0.08);
  --bg-active: rgba(124,58,237,0.12); --text-primary: #1a1a2e; --text-secondary: #6b7280;
  --text-subtle: #9ca3af; --border-color: rgba(0,0,0,0.06);
  --card-border: rgba(0,0,0,0.08); --glow-border: rgba(124,58,237,0.2);
  --glow-shadow: rgba(124,58,237,0.05); --scrollbar-track: #f1f3f9;
  --scrollbar-thumb: #a78bfa; --modal-bg: #ffffff; --modal-border: rgba(0,0,0,0.1);
  --badge-bg: rgba(0,0,0,0.04); --stat-bg: rgba(124,58,237,0.05);
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); }
*::-webkit-scrollbar { width: 6px; }
*::-webkit-scrollbar-track { background: var(--scrollbar-track); }
*::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: var(--bg-primary); color: var(--text-primary); transition: background 0.3s, color 0.3s; }
.gradient-text { background: linear-gradient(135deg, #7c3aed, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.glow-border { border: 1px solid var(--glow-border); box-shadow: 0 0 15px var(--glow-shadow); }
.pulse-dot { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(1.2); } }
@keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.slide-in { animation: slideIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.fade-in { animation: fadeIn 0.2s ease-out; }
.typing-indicator span { display:inline-block; width:6px; height:6px; border-radius:50%; background:#7c3aed; margin:0 2px; animation: typing 1.4s infinite; }
.typing-indicator span:nth-child(2) { animation-delay:0.2s; }
.typing-indicator span:nth-child(3) { animation-delay:0.4s; }
@keyframes typing { 0%,60%,100% { transform:translateY(0); opacity:0.4; } 30% { transform:translateY(-6px); opacity:1; } }
.chat-bubble-user { background: linear-gradient(135deg, #7c3aed, #5b21b6); color: white; }
.chat-bubble-ai { background: var(--bg-tertiary); border: 1px solid rgba(124,58,237,0.2); color: var(--text-primary); }
.chat-bubble-human { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3); color: var(--text-primary); }
.sidebar-item { transition: background 0.2s; color: var(--text-secondary); }
.sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-item.active { background: var(--bg-active); border-left: 3px solid #7c3aed; color: #a78bfa; }
.card { background: var(--bg-card); border: 1px solid var(--card-border); border-radius: 0.75rem; color: var(--text-primary); }
.btn-primary { background: linear-gradient(135deg, #7c3aed, #00d4ff); color: white; border: none; cursor: pointer; }
.btn-primary:hover { opacity: 0.9; }
.btn-secondary { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); cursor: pointer; }
.btn-secondary:hover { background: var(--bg-hover); }
.btn-danger { background: rgba(255,0,110,0.1); border: 1px solid rgba(255,0,110,0.3); color: #ff006e; cursor: pointer; }
.btn-danger:hover { background: rgba(255,0,110,0.2); }
.btn-success { background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.3); color: #00ff88; cursor: pointer; }
.btn-warning { background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.3); color: #eab308; cursor: pointer; }
.btn-google { background: #ffffff; color: #1a1a2e; border: 1px solid rgba(0,0,0,0.1); cursor: pointer; font-weight: 500; }
.btn-google:hover { background: #f8f9fc; }
.input-field { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); outline: none; }
.input-field:focus { border-color: #7c3aed; }
.input-field::placeholder { color: var(--text-subtle); }
.text-muted { color: var(--text-secondary); }
.text-subtle { color: var(--text-subtle); }
.border-subtle { border-color: var(--border-color); }
.plan-badge { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.625rem; font-weight: 600; text-transform: uppercase; }
.plan-free { background: rgba(107,114,128,0.15); color: #9ca3af; }
.plan-pro { background: rgba(124,58,237,0.15); color: #a78bfa; }
.plan-enterprise { background: rgba(0,212,255,0.15); color: #00d4ff; }
.plan-banned { background: rgba(255,0,110,0.15); color: #ff006e; }
.plan-restricted { background: rgba(234,179,8,0.15); color: #eab308; }
.key-status-active { background: rgba(0,255,136,0.1); color: #00ff88; }
.key-status-paused { background: rgba(234,179,8,0.1); color: #eab308; }
.key-status-blocked { background: rgba(255,0,110,0.1); color: #ff006e; }
.key-status-expired { background: rgba(107,114,128,0.15); color: #9ca3af; }
.tab-btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; background: transparent; border: none; color: var(--text-secondary); }
.tab-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.tab-btn.active { background: var(--bg-active); color: #a78bfa; }
.faq-item { border-bottom: 1px solid var(--border-color); }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease-out; }
.modal-content { background: var(--modal-bg); border: 1px solid var(--modal-border); border-radius: 1rem; padding: 2rem; max-width: 36rem; width: 90%; color: var(--text-primary); max-height: 90vh; overflow-y: auto; }
.action-btn { padding: 0.375rem 0.625rem; border-radius: 0.375rem; font-size: 0.75rem; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.25rem; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 0.75rem 1rem; font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
td { padding: 0.875rem 1rem; font-size: 0.875rem; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
tr:hover td { background: var(--bg-hover); }
.divider { display: flex; align-items: center; gap: 0.75rem; margin: 1rem 0; color: var(--text-subtle); font-size: 0.75rem; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
.google-icon { display: inline-flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem; margin-right: 0.5rem; }
.api-key-display { font-family: 'Courier New', monospace; background: var(--bg-tertiary); padding: 0.5rem 0.75rem; border-radius: 0.375rem; font-size: 0.8125rem; letter-spacing: 0.5px; }
.doc-section { border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
.endpoint-badge { display: inline-flex; padding: 0.25rem 0.625rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600; font-family: monospace; }
.method-get { background: rgba(0,212,255,0.15); color: #00d4ff; }
.method-post { background: rgba(0,255,136,0.15); color: #00ff88; }
.method-put { background: rgba(234,179,8,0.15); color: #eab308; }
.method-delete { background: rgba(255,0,110,0.15); color: #ff006e; }
.method-patch { background: rgba(124,58,237,0.15); color: #a78bfa; }
.code-block { background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 1rem; font-family: 'Courier New', monospace; font-size: 0.8125rem; overflow-x: auto; margin: 0.75rem 0; white-space: pre; }
.credit-card-option { background: var(--bg-input); border: 2px solid var(--border-color); border-radius: 0.75rem; padding: 1rem; cursor: pointer; transition: all 0.2s; }
.credit-card-option:hover { border-color: rgba(124,58,237,0.4); }
.credit-card-option.selected { border-color: #7c3aed; background: rgba(124,58,237,0.1); }
</style>

function render() {

  let html = '';
  const isAdminView = state.currentRole === 'admin' && (state.currentView === 'admin-dashboard' || state.currentView === 'admin-chat');
  const isUserView = !isAdminView && state.currentView !== 'landing' && state.currentView !== 'admin-login';
  
  if (isUserView || isAdminView) html += renderNavbar();
  if (state.currentView === 'landing') html += renderLanding();
  else if (state.currentView === 'user-chat') html += renderUserChat();
  else if (state.currentView === 'user-all-chats') html += renderUserAllChats();
  else if (state.currentView === 'user-coder') html += renderUserCoder();
  else if (state.currentView === 'user-profile') html += renderUserProfile();

  else if (state.currentView === 'user-api-docs') html += renderApiDocs();
  else if (state.currentView === 'user-help') html += renderUserHelp();
  else if (state.currentView === 'user-settings') html += renderUserSettings();
  else if (state.currentView === 'admin-login') html += renderAdminLogin();
  else if (state.currentView === 'admin-dashboard') html += renderAdminDashboard();
  else if (state.currentView === 'admin-chat') html += renderAdminChat();
  
  app.innerHTML = html;
  
  if (state.showAuthModal) { const d = document.createElement('div'); d.innerHTML = renderAuthModal(); document.body.appendChild(d.firstElementChild); }
  if (state.showUpgradeModal) { const d = document.createElement('div'); d.innerHTML = renderUpgradeModal(); document.body.appendChild(d.firstElementChild); }
  if (state.showDeleteModal) { const d = document.createElement('div'); d.innerHTML = renderDeleteModal(); document.body.appendChild(d.firstElementChild); }
  if (state.showUserActionModal) { const d = document.createElement('div'); d.innerHTML = renderUserActionModal(); document.body.appendChild(d.firstElementChild); }
  if (state.showCreateKeyModal) { const d = document.createElement('div'); d.innerHTML = renderCreateKeyModal(); document.body.appendChild(d.firstElementChild); }

}

function renderMessage(msg) {
  if (msg.role === 'user') return `<div class="slide-in" style="display:flex;align-items:flex-start;gap:0.75rem;justify-content:flex-end"><div class="chat-bubble-user" style="border-radius:1rem;border-top-right-radius:0.25rem;padding:0.75rem 1rem;max-width:28rem"><p style="font-size:0.875rem;line-height:1.625">${msg.content}</p><p style="font-size:0.625rem;color:rgba(255,255,255,0.5);margin-top:0.25rem;text-align:right">${msg.timestamp}</p></div><div style="width:2rem;height:2rem;border-radius:0.5rem;background:linear-gradient(135deg,#7c3aed,#00d4ff);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white">${I.user}</div></div>`;
  if (msg.role === 'ai') return `<div class="slide-in" style="display:flex;align-items:flex-start;gap:0.75rem"><div style="width:2rem;height:2rem;border-radius:0.5rem;background:rgba(124,58,237,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#a78bfa">${I.robot}</div><div class="chat-bubble-ai" style="border-radius:1rem;border-top-left-radius:0.25rem;padding:0.75rem 1rem;max-width:36rem"><p style="font-size:0.875rem;line-height:1.625;white-space:pre-line">${msg.content}</p><p style="font-size:0.625rem;color:var(--text-subtle);margin-top:0.5rem">${msg.timestamp}</p></div></div>`;
  if (msg.role === 'human') return `<div class="slide-in" style="display:flex;align-items:flex-start;gap:0.75rem"><div style="width:2rem;height:2rem;border-radius:0.5rem;background:rgba(0,212,255,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#00d4ff">${I.userStar}</div><div class="chat-bubble-human" style="border-radius:1rem;border-top-left-radius:0.25rem;padding:0.75rem 1rem;max-width:36rem"><div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.25rem"><span style="font-size:0.75rem;font-weight:500;color:#00d4ff">Admin Expert</span><span style="font-size:0.625rem;padding:0.125rem 0.375rem;border-radius:0.25rem;background:rgba(0,212,255,0.1);color:#00d4ff">Human</span></div><p style="font-size:0.875rem;line-height:1.625">${msg.content}</p><p style="font-size:0.625rem;color:var(--text-subtle);margin-top:0.5rem">${msg.timestamp}</p></div></div>`;
  return '';
}

display:flex;align-items:center;gap:0.75rem;padding:0.625rem 0.75rem;border-radius:0.5rem;cursor:pointer" onclick="setAdminTab('requests')"><span style="color:#ff006e">${I.userStar}</span><span style="font-size:0.875rem">Human Requests</span>${requestedChats.length > 0 ? `<span style="margin-left:auto;width:1.25rem;height:1.25rem;border-radius:9999px;background:#ff006e;display:flex;align-items:center;justify-content:center;font-size:0.625rem;font-weight:bold;color:white" class="pulse-dot">${requestedChats.length}</span>` : ''}</div><div class="sidebar-item ${state.adminTab === 'analytics' ? 'active' : ''}" style="display:flex;align-items:center;gap:0.75rem;padding:0.625rem 0.75rem;border-radius:0.5rem;cursor:pointer" onclick="setAdminTab('analytics')"><span style="color:#9ca3af">${I.chart}</span><span style="font-size:0.875rem">Analytics</span></div><div class="sidebar-item ${state.adminTab === 'settings' ? 'active' : ''}" style="display:flex;align-items:center;gap:0.75rem;padding:0.625rem 0.75rem;border-radius:0.5rem;cursor:pointer" onclick="setAdminTab('settings')"><span style="color:#9ca3af">${I.settings}</span><span style="font-size:0.875rem">Settings</span></div></nav><div style="padding:0.75rem;border-top:1px solid var(--border-color)"><button onclick="logoutAdmin()" class="btn-secondary" style="width:100%;padding:0.5rem;border-radius:0.5rem;font-size:0.875rem;display:flex;align-items:center;justify-content:center;gap:0.5rem">${I.logout} Sign Out</button></div></aside><div style="flex:1;overflow-y:auto"><div style="padding:1.5rem">${state.adminTab === 'dashboard' ? renderAdminDashboardContent(requestedChats, joinedChats, bannedUsers, restrictedUsers) : ''}${state.adminTab === 'users' ? renderAdminUsersManagement() : ''}${state.adminTab === 'chats' ? renderAdminAllChats() : ''}${state.adminTab === 'requests' ? renderAdminRequests(requestedChats) : ''}${state.adminTab === 'analytics' ? renderAdminAnalytics() : ''}${state.adminTab === 'settings' ? renderAdminSett function renderAdminDashboardContent(requestedChats, joinedChats, bannedUsers, restrictedUsers) { return `<h2 style="font-size:1.5rem;font-weight:bold;margin-bottom:1.5rem;color:var(--text-primary)">Dashboard Overview</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem">${renderStatCard('Total Users', '2,847', '+12%', I.users)}${renderStatCard('Active Chats', '342', '+8%', I.chat)}${renderStatCard('Human Requests', String(requestedChats.length), 'Pending', I.userStar)}${renderStatCard('API Calls Today', '12.4K', '+23%', I.zap)}${renderStatCard('Banned Users', String(bannedUsers), 'Actioned', I.ban)}${renderStatCard('Restricted', String(restrictedUsers), 'Limited', I.restrict)}</div>${joinedChats.length > 0 ? `<div class="card glow-border" style="margin-bottom:2rem;border-color:rgba(0,212,255,0.3)"><div style="padding:1.25rem;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:0.75rem"><div style="width:2.25rem;height:2.25rem;border-radius:0.5rem;background:rgba(0,212,255,0.1);display:flex;align-items:center;justify-content:center;color:#00d4ff">${I.userStar}</div><div><h3 style="font-weight:600;color:var(--text-primary)">Your Active Sessions</h3><p style="font-size:0.75rem;color:var(--text-secondary)">Chats you're currently responding to</p></div></div><div>${joinedChats.map(chat => { const user = mockUsers.find(u => u.id === chat.userId); return `<div style="display:flex;align-items:center;gap:1rem;padding:1rem;border-bottom:1px solid var(--border-color)"><div style="width:2.25rem;height:2.25rem;border-radius:9999px;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;color:var(--text-secondary)">${I.user}</div><div style="flex:1;min-width:0"><p style="font-weight:500;font-size:0.875rem;color:var(--text-primary)">${user.name}</p><p style="font-size:0.75rem;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c function renderAdminUsersManagement() { const filtered = mockUsers.filter(u => !state.userSearch || u.name.toLowerCase().includes(state.userSearch.toLowerCase()) || u.email.toLowerCase().includes(state.userSearch.toLowerCase())); return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem"><div><h2 style="font-size:1.5rem;font-weight:bold;color:var(--text-primary)">User Management</h2><p style="color:var(--text-secondary);font-size:0.875rem">Ban, restrict, delete users and override plans</p></div><input type="text" placeholder="Search users..." value="${state.userSearch}" oninput="state.userSearch=this.value;render()" class="input-field" style="padding:0.625rem 1rem;border-radius:0.5rem;font-size:0.875rem;width:200px"></div><div class="card glow-border" style="overflow-x:auto"><table><thead><tr><th>User</th><th>Email</th><th>Plan</th><th>Status</th><th>Usage</th><th>Member Since</th><th>Actions</th></tr></thead><tbody>${filtered.map(u => { let statusBadge = ''; if (u.accountStatus === 'banned') statusBadge = `<span class="plan-badge plan-banned">Banned</span>`; else if (u.accountStatus === 'restricted') statusBadge = `<span class="plan-badge plan-restricted">Restricted</span>`; else statusBadge = `<span class="plan-badge plan-pro" style="background:rgba(0,255,136,0.1);color:#00ff88">Active</span>`; const planBadge = `<span class="plan-badge plan-${u.plan.toLowerCase()}">${u.plan}</span>`; const customLimit = u.customLimits ? `<span style="font-size:0.625rem;color:#eab308"> (${u.customLimits.messagesPerDay}/day)</span>` : ''; return `<tr><td><div style="display:flex;align-items:center;gap:0.75rem"><div style="width:2rem;height:2rem;border-radius:9999px;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;color:var(--text-secondary)">${I.user}</div><span style="font-weight:500;color:var(--text-primary)">${u.name}</span></div></td><td style="color:var(--text-secondary)">${u.email}</td><td>${plan rgin-top:0.5rem;margin-left:2.75rem">Responding as Human Expert</p>` : `<div style="display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.5rem;color:var(--text-subtle)">${I.lock}<span style="font-size:0.875rem">Join as human expert to respond in this chat</span></div>`}</div></div><aside style="width:18rem;background:var(--bg-secondary);border-left:1px solid var(--border-color);overflow-y:auto"><div style="padding:1.25rem;border-bottom:1px solid var(--border-color)"><h4 style="font-size:0.75rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;margin-bottom:1rem">User Details</h4><div style="text-align:center"><div style="width:3.5rem;height:3.5rem;border-radius:9999px;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);margin:0 auto 0.75rem">${I.user}</div><p style="font-weight:600;color:var(--text-primary)">${user.name}</p><p style="font-size:0.875rem;color:var(--text-secondary)">${user.email}</p><span class="plan-badge plan-${user.plan.toLowerCase()}" style="margin-top:0.5rem">${user.plan} Plan</span>${user.accountStatus !== 'active' ? `<span class="plan-badge plan-${user.accountStatus}" style="margin-top:0.25rem;margin-left:0.25rem">${user.accountStatus}</span>` : ''}</div></div><div style="padding:1.25rem;border-bottom:1px solid var(--border-color)"><h4 style="font-size:0.75rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;margin-bottom:0.75rem">Session Info</h4><div style="display:flex;justify-content:space-between;font-size:0.875rem;margin-bottom:0.5rem"><span style="color:var(--text-secondary)">Total Messages</span><span style="color:var(--text-primary)">${chat.messages}</span></div><div style="display:flex;justify-content:space-between;font-size:0.875rem;margin-bottom:0.5rem"><span style="color:var(--text-secondary)">Status</span><span style="color:#00ff88">${chat.status}</span></div><div style="display:flex;justify-content:space-betw 00 credits. Rate: $0.0015/credit</p></div></div></div>`;

function renderKeyActionModal() {
  const action = state.showKeyActionModal; if (!action) return '';
  const key = state.apiKeys.find(k => k.id === action.keyId); if (!key) return '';
  let title = '', content = '', confirmText = '', confirmClass = 'btn-primary';
  switch(action.type) {
    case 'pause': title = 'Pause API Key'; content = `<p style="font-size:0.875rem;color:var(--text-primary);margin-bottom:1rem">Pause <strong>${key.name}</strong>? The key will stop working but can be resumed later.</p>`; confirmText = 'Pause Key'; confirmClass = 'btn-warning'; break;
    case 'resume': title = 'Resume API Key'; content = `<p style="font-size:0.875rem;color:var(--text-primary);margin-bottom:1rem">Resume <strong>${key.name}</strong>? The key will become active again.</p>`; confirmText = 'Resume Key'; confirmClass = 'btn-success'; break;
    case 'block': title = 'Block API Key'; content = `<p style="font-size:0.875rem;color:var(--text-primary);margin-bottom:1rem">Block <strong>${key.name}</strong>? This will immediately stop all API calls using this key.</p>`; confirmText = 'Block Key'; confirmClass = 'btn-danger'; break;
    case 'unblock': title = 'Unblock API Key'; content = `<p style="font-size:0.875rem;color:var(--text-primary);margin-bottom:1rem">Unblock <strong>${key.name}</strong>?</p>`; confirmText = 'Unblock Key'; confirmClass = 'btn-success'; break;
    case 'regenerate': title = 'Regenerate API Key'; content = `<p style="font-size:0.875rem;color:var(--text-primary);margin-bottom:1rem">Regenerate <strong>${key.name}</strong>? The old key will stop working immediately. Make sure to update it in all your apps.</p>`; confirmText = 'Regenerate'; confirmClass = 'btn-warning'; break;
    case 'delete': title = 'Delete API Key'; content = `<p style="font-size:0.875rem;color:var(--text-primary);margin-bottom:1rem">Permanently delete <strong>${key.name}</strong>? This cannot be undone.</p>`; confirmText = 'Delete Key'; confirmClass = 'btn-danger'; break;
  }
  return `<div class="modal-backdrop" onclick="closeKeyActionModal(event)"><div class="modal-content" onclick="event.stopPropagation()"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem"><h3 style="font-weight:600;color:var(--text-primary)">${title}</h3><button onclick="closeKeyActionModal()" style="background:transparent;border:none;color:var(--text-secondary);cursor:pointer">${I.x}</button></div>${content}<div style="display:flex;gap:0.75rem"><button onclick="closeKeyActionModal()" class="btn-secondary" style="flex:1;padding:0.75rem;border-radius:0.5rem;font-weight:500">Cancel</button><button onclick="confirmKeyAction()" class="${confirmClass}" style="flex:1;padding:0.75rem;border-radius:0.5rem;font-weight:500">${confirmText}</button></div></div></div>`;
}

  const action = state.showUserActionModal; if (!action) return '';
  const user = mockUsers.find(u => u.id === action.userId); if (!user) return '';
  let title = '', content = '', confirmText = '', confirmClass = 'btn-primary';
  switch(action.type) {
    case 'view': title = 'User Details'; content = `<div style="display:flex;flex-direction:column;gap:0.75rem"><div style="display:flex;justify-content:space-between;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem"><span style="color:var(--text-secondary)">Name</span><span style="color:var(--text-primary)">${user.name}</span></div><div style="display:flex;justify-content:space-between;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem"><span style="color:var(--text-secondary)">Email</span><span style="color:var(--text-primary)">${user.email}</span></div><div style="display:flex;justify-content:space-between;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem"><span style="color:var(--text-secondary)">Plan</span><span class="plan-badge plan-${user.plan.toLowerCase()}">${user.plan}</span></div><div style="display:flex;justify-content:space-between;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem"><span style="color:var(--text-secondary)">Status</span><span style="color:var(--text-primary)">${user.accountStatus}</span></div><div style="display:flex;justify-content:space-between;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem"><span style="color:var(--text-secondary)">Messages Today</span><span style="color:var(--text-primary)">${user.messagesToday}</span></div><div style="display:flex;justify-content:space-between;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem"><span style="color:var(--text-secondary)">Total Chats</span><span style="color:var(--text-primary)">${user.totalChats}</span></div><div style="display:flex;justify-content:space-between;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem"><span style="color:var(--text-secondary)">API Calls</span><span style="color:var(--text-primary)">${user.apiCalls.toLocaleString()}</span></div><div style="display:flex;justify-content:space-between;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem"><span style="color:var(--text-secondary)">Human Requests</span><span style="color:var(--text-primary)">${user.humanRequests}</span></div><div style="display:flex;justify-content:space-between;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem"><span style="color:var(--text-secondary)">Member Since</span><span style="color:var(--text-primary)">${user.memberSince}</span></div>${user.customLimits ? `<div style="display:flex;justify-content:space-between;padding:0.75rem;background:rgba(234,179,8,0.1);border-radius:0.5rem"><span style="color:#eab308">Custom Limit</span><span style="color:#eab308">${user.customLimits.messagesPerDay} msgs/day</span></div>` : ''}</div>`; confirmText = 'Close'; confirmClass = 'btn-secondary'; break;
    case 'plan': title = 'Override Plan'; content = `<p style="font-size:0.875rem;color:var(--text-secondary);margin-bottom:1rem">Change plan for <strong style="color:var(--text-primary)">${user.name}</strong></p><select id="plan-override-select" class="input-field" style="width:100%;padding:0.75rem;border-radius:0.5rem;font-size:0.875rem"><option value="free" ${user.plan === 'Free' ? 'selected' : ''}>Free</option><option value="pro" ${user.plan === 'Pro' ? 'selected' : ''}>Pro</option><option value="enterprise" ${user.plan === 'Enterprise' ? 'selected' : ''}>Enterprise</option></select>`; confirmText = 'Apply Plan Override'; break;
    case 'limit': title = 'Set Usage Limits'; content = `<p style="font-size:0.875rem;color:var(--text-secondary);margin-bottom:1rem">Set custom daily message limit for <strong style="color:var(--text-primary)">${user.name}</strong></p><label style="font-size:0.75rem;color:var(--text-secondary);display:block;margin-bottom:0.25rem">Daily Messages (0 = unlimited)</label><input type="number" id="limit-input" value="${user.customLimits ? user.customLimits.messagesPerDay : 0}" class="input-field" style="width:100%;padding:0.75rem;border-radius:0.5rem;font-size:0.875rem"><p style="font-size:0.75rem;color:var(--text-subtle);margin-top:0.5rem">Leave as 0 to use plan defaults</p>`; confirmText = 'Apply Limit'; break;
    case 'ban': title = 'Ban User'; content = `<p style="font-size:0.875rem;color:var(--text-primary);margin-bottom:1rem">Are you sure you want to ban <strong>${user.name}</strong>? They will be immediately logged out.</p>`; confirmText = 'Ban User'; confirmClass = 'btn-danger'; break;
    case 'unban': title = 'Unban User'; content = `<p style="font-size:0.875rem;color:var(--text-primary);margin-bottom:1rem">Unban <strong>${user.name}</strong>? They will regain access.</p>`; confirmText = 'Unban User'; confirmClass = 'btn-success'; break;
    case 'restrict': title = 'Restrict User'; content = `<p style="font-size:0.875rem;color:var(--text-primary);margin-bottom:1rem">Restrict <strong>${user.name}</strong>? Their usage will be limited.</p>`; confirmText = 'Restrict User'; confirmClass = 'btn-warning'; break;
    case 'unrestrict': title = 'Remove Restriction'; content = `<p style="font-size:0.875rem;color:var(--text-primary);margin-bottom:1rem">Remove restrictions from <strong>${user.name}</strong>?</p>`; confirmText = 'Remove Restriction'; confirmClass = 'btn-success'; break;
    case 'delete': title = 'Delete User Account'; content = `<p style="font-size:0.875rem;color:var(--text-primary);margin-bottom:1rem">Permanently delete <strong>${user.name}</strong>'s account and all data? This cannot be undone.</p>`; confirmText = 'Delete Account'; confirmClass = 'btn-danger'; break;
  }
  return `<div class="modal-backdrop" onclick="closeUserActionModal(event)"><div class="modal-content" onclick="event.stopPropagation()"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem"><h3 style="font-weight:600;color:var(--text-primary)">${title}</h3><button onclick="closeUserActionModal()" style="background:transparent;border:none;color:var(--text-secondary);cursor:pointer">${I.x}</button></div>${content}<div style="display:flex;gap:0.75rem;margin-top:1.5rem"><button onclick="closeUserActionModal()" class="btn-secondary" style="flex:1;padding:0.75rem;border-radius:0.5rem;font-weight:500">Cancel</button><button onclick="confirmUserAction()" class="${confirmClass}" style="flex:1;padding:0.75rem;border-radius:0.5rem;font-weight:500">${confirmText}</button></div></div></div>`;
}

// ============ ACTIONS ============
function navigateTo(view) {
  const requiresAuth = ['user-chat', 'user-all-chats', 'user-coder', 'user-profile', 'user-plans', 'user-settings', 'user-help', 'user-api-keys', 'user-api-docs'];
  if (requiresAuth.includes(view) && state.userEmail === '') { state.showAuthModal = true; state.authMode = 'signin'; render(); return; }
  state.currentView = view;
  render();
  setTimeout(() => { const el = document.getElementById('chat-messages') || document.getElementById('admin-chat-messages'); if (el) el.scrollTop = el.scrollHeight; }, 50);
}

function openAuthModal(mode) { state.authMode = mode || 'signin'; state.showAuthModal = true; render(); }
function closeAuthModal(e) { if (e && e.target !== e.currentTarget) return; state.showAuthModal = null; render(); }
function toggleAuthMode() { state.authMode = state.authMode === 'signin' ? 'signup' : 'signin'; render(); }

function signInWithGoogle() {
  const mockGoogleUser = { name: 'Alex Morgan', email: 'alex.morgan@gmail.com', avatar: 'A', provider: 'Google' };
  state.userName = mockGoogleUser.name; state.userEmail = mockGoogleUser.email; state.userAvatar = mockGoogleUser.avatar; state.userProvider = mockGoogleUser.provider;
  state.memberSince = new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  state.currentPlan = 'free'; state.showAuthModal = null; state.currentView = 'user-chat';
  render();
}

function signInWithEmail() {
  const nameInput = document.getElementById('auth-name');
  const emailInput = document.getElementById('auth-email');
  const passwordInput = document.getElementById('auth-password');
  const email = emailInput ? emailInput.value.trim() : '';
  const name = nameInput ? nameInput.value.trim() : email.split('@')[0];
  const password = passwordInput ? passwordInput.value : '';
  if (!email || !password) { alert('Please fill in all fields'); return; }
  if (password.length < 6) { alert('Password must be at least 6 characters'); return; }
  state.userName = state.authMode === 'signup' ? (name || email.split('@')[0]) : (name || email.split('@')[0]);
  state.userEmail = email; state.userAvatar = state.userName.charAt(0).toUpperCase(); state.userProvider = 'Email';
  state.memberSince = new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  state.showAuthModal = null; state.currentView = 'user-chat'; render();
}

function signOut() {
  state.userName = ''; state.userEmail = ''; state.userAvatar = ''; state.userProvider = '';
  state.currentPlan = 'free'; state.currentView = 'landing';
  state.messagesToday = 0; state.totalChats = 0; state.apiCalls = 0; state.humanRequestsUsed = 0;
  render();
}

function toggleTheme() { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); }
function setTheme(t) { state.theme = t; render(); }
function loginAdmin() { state.currentRole = 'admin'; state.currentView = 'admin-dashboard'; state.adminTab = 'dashboard'; render(); }
function logoutAdmin() { state.currentRole = 'user'; state.currentView = 'landing'; render(); }
function setAdminTab(tab) { state.adminTab = tab; render(); }
function setApiTab(tab) { state.apiTab = tab; render(); }
function newChat() { state.humanRequested = false; state.humanJoined = false; mockMessages.length = 0; navigateTo('user-chat'); }
function openChat(id) { navigateTo('user-chat'); }
function handleCoderClick() { if (state.currentPlan === 'free') { state.showUpgradeModal = 'coder'; render(); } else { navigateTo('user-coder'); } }
function handleHumanRequest() { if (state.currentPlan === 'free') { state.showUpgradeModal = 'human'; render(); return; } requestHuman(); }
function requestHuman() { state.humanRequested = true; state.humanRequestsUsed++; mockMessages.push({ id: mockMessages.length + 1, role: 'ai', content: 'Human response requested\n\nI\'ve flagged this conversation for human expert review.', timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }); render(); setTimeout(() => { state.humanJoined = true; render(); }, 8000); }
function sendMessage() { const input = document.getElementById('user-message-input'); if (!input || !input.value.trim()) return; const msg = { id: mockMessages.length + 1, role: 'user', content: input.value.trim(), timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }; mockMessages.push(msg); state.newMessage = ''; state.isTyping = true; state.messagesToday++; render(); setTimeout(() => { state.isTyping = false; mockMessages.push({ id: mockMessages.length + 1, role: 'ai', content: "That's a great question! Here are the key points:\n\n1. Evaluate the current architecture\n2. Identify bottlenecks\n3. Implement incremental improvements", timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }); render(); const el = document.getElementById('chat-messages'); if (el) el.scrollTop = el.scrollHeight; }, 2000); }
function joinChat(chatId) { state.selectedChat = chatId; state.adminJoinedChats.add(chatId); state.currentView = 'admin-chat'; render(); }
function viewChat(chatId) { state.selectedChat = chatId; state.currentView = 'admin-chat'; render(); }
function leaveChat(chatId) { state.adminJoinedChats.delete(chatId); if (state.currentView === 'admin-chat' && state.selectedChat === chatId) state.currentView = 'admin-dashboard'; render(); }
function joinAsHuman() { if (state.selectedChat) state.adminJoinedChats.add(state.selectedChat); render(); setTimeout(() => { const input = document.getElementById('admin-message-input'); if (input) input.focus(); }, 100); }
function sendAdminMessage() { const input = document.getElementById('admin-message-input'); if (!input || !input.value.trim()) return; mockMessages.push({ id: mockMessages.length + 1, role: 'human', content: input.value.trim(), timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }); state.adminMessage = ''; render(); const el = document.getElementById('admin-chat-messages'); if (el) el.scrollTop = el.scrollHeight; }
function toggleFaq(i) { state.openFaq = state.openFaq === i ? null : i; render(); }
function setSettingsTab(tab) { state.settingsTab = tab; render(); }
function setLanguage(lang) { state.language = lang; render(); }
function toggleDataControl(key) { state.dataControls[key] = !state.dataControls[key]; render(); }
function selectPlan(plan) { state.currentPlan = plan; render(); setTimeout(() => alert(`Successfully switched to ${plan} plan!`), 100); }
function openDeleteModal() { state.showDeleteModal = true; render(); }
function closeDeleteModal(e) { if (e && e.target !== e.currentTarget) return; state.showDeleteModal = false; render(); }
function confirmDelete() { state.deleteRequested = true; state.showDeleteModal = false; render(); }
function closeUpgradeModal(e) { if (e && e.target !== e.currentTarget) return; state.showUpgradeModal = null; render(); }
function openUserAction(userId, type) { state.showUserActionModal = { userId, type }; render(); }
function closeUserActionModal(e) { if (e && e.target !== e.currentTarget) return; state.showUserActionModal = null; render(); }
function confirmUserAction() {
  const action = state.showUserActionModal; if (!action) return;
  const user = mockUsers.find(u => u.id === action.userId); if (!user) return;
  switch(action.type) {
    case 'plan': const newPlan = document.getElementById('plan-override-select').value; user.plan = newPlan.charAt(0).toUpperCase() + newPlan.slice(1); break;
    case 'limit': const limit = parseInt(document.getElementById('limit-input').value); user.customLimits = limit > 0 ? { messagesPerDay: limit } : null; break;
    case 'ban': user.accountStatus = 'banned'; break;
    case 'unban': user.accountStatus = 'active'; break;
    case 'restrict': user.accountStatus = 'restricted'; user.customLimits = { messagesPerDay: 20 }; break;
    case 'unrestrict': user.accountStatus = 'active'; user.customLimits = null; break;
    case 'delete': const idx = mockUsers.findIndex(u => u.id === user.id); if (idx > -1) mockUsers.splice(idx, 1); break;
  }
  state.showUserActionModal = null; render();
}

function openCreateKeyModal() { state.showCreateKeyModal = true; render(); }
function closeCreateKeyModal(e) { if (e && e.target !== e.currentTarget) return; state.showCreateKeyModal = false; render(); }
function confirmCreateKey() {
  const nameInput = document.getElementById('new-key-name');
  const expiryInput = document.getElementById('new-key-expiry');
  const tokensInput = document.getElementById('new-key-tokens');
  const name = nameInput ? nameInput.value.trim() : '';
  const expiryDays = expiryInput ? parseInt(expiryInput.value) : 30;
  const tokens = tokensInput ? parseInt(tokensInput.value) : 5000;
  if (!name) { alert('Please enter a key name'); return; }
  if (tokens > state.totalBalance) { alert('Insufficient balance'); return; }
  const now = new Date();
  const expiryDate = expiryDays === 0 ? null : new Date(now.getTime() + expiryDays * 24 * 60 * 60 * 1000);
  const keyId = 'k' + (state.apiKeys.length + 1);
  const keyStr = 'nx_live_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
  state.apiKeys.push({
    id: keyId, name: name, key: keyStr,
    created: now.toISOString().split('T')[0],
    expiry: expiryDate ? expiryDate.toISOString().split('T')[0] : 'Never',
    tokens: tokens, used: 0, status: 'active', lastUsed: 'Never'
  });
  state.totalBalance -= tokens;
  state.showCreateKeyModal = false;
  render();
  setTimeout(() => alert(`API key created successfully!\n\nKey: ${keyStr}\n\nSave this key — it won't be shown again.`), 100);
}

function openRechargeModal() { state.showRechargeModal = true; render(); }
function closeRechargeModal(e) { if (e && e.target !== e.currentTarget) return; state.showRechargeModal = false; state.selectedCreditPackage = null; render(); }
function selectCreditPackage(amount) { state.selectedCreditPackage = amount; state.customCreditAmount = 0; render(); }
function updateCustomCredits(val) { state.customCreditAmount = parseInt(val) || 0; state.selectedCreditPackage = null; render(); }
function processRecharge() {
  const amount = state.selectedCreditPackage || state.customCreditAmount;
  if (!amount || amount < 100) { alert('Please select at least 100 credits'); return; }
  const price = amount * 0.0015;
  state.totalBalance += amount;
  state.selectedCreditPackage = null; state.customCreditAmount = 0;
  render();
  setTimeout(() => alert(`Successfully added ${amount.toLocaleString()} credits!\nNew balance: ${state.totalBalance.toLocaleString()} credits\nCharged: $${price.toFixed(2)}`), 100);
}
function processCustomRecharge() {
  const input = document.getElementById('modal-custom-credits');
  const amount = input ? parseInt(input.value) : 0;
  if (!amount || amount < 100) { alert('Minimum 100 credits'); return; }
  state.totalBalance += amount;
  state.showRechargeModal = false;
  render();
  setTimeout(() => alert(`Successfully added ${amount.toLocaleString()} credits!`), 100);
}

function openKeyAction(keyId, type) { state.showKeyActionModal = { keyId, type }; render(); }
function closeKeyActionModal(e) { if (e && e.target !== e.currentTarget) return; state.showKeyActionModal = null; render(); }
function confirmKeyAction() {
  const action = state.showKeyActionModal; if (!action) return;
  const key = state.apiKeys.find(k => k.id === action.keyId); if (!key) return;
  switch(action.type) {
    case 'pause': key.status = 'paused'; break;
    case 'resume': key.status = 'active'; break;
    case 'block': key.status = 'blocked'; break;
    case 'unblock': key.status = 'active'; break;
    case 'regenerate': key.key = 'nx_live_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15); key.status = 'active'; break;
    case 'delete': const idx = state.apiKeys.findIndex(k => k.id === key.id); if (idx > -1) state.apiKeys.splice(idx, 1); break;
  }
  state.showKeyActionModal = null; render();
}

function copyKey(keyId) {
  const key = state.apiKeys.find(k => k.id === keyId);
  if (key) {
    navigator.clipboard.writeText(key.key).then(() => {
      alert('API key copied to clipboard!');
    }).catch(() => {
      alert('Key: ' + key.key);
    });
  }
}

function attachEventListeners() {
  setTimeout(() => {
    const el1 = document.getElementById('chat-messages'); if (el1) el1.scrollTop = el1.scrollHeight;
    const el2 = document.getElementById('admin-chat-messages'); if (el2) el2.scrollTop = el2.scrollHeight;
  }, 50);
}

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.shiftKey && e.key === 'A') { e.preventDefault(); if (state.currentRole === 'admin') navigateTo('admin-dashboard'); else navigateTo('admin-login'); }
});

render();
</script>
</body>
</html>
