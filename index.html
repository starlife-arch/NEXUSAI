<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Laud</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-tertiary: #1a1a2e;
  --bg-card: #12121a; --bg-input: #1a1a2e; --bg-hover: rgba(124,58,237,0.1);
  --bg-active: rgba(124,58,237,0.2); --text-primary: #ffffff; --text-secondary: #9ca3af;
  --text-subtle: #6b7280; --border-color: rgba(255,255,255,0.05);
  --card-border: rgba(255,255,255,0.05); --glow-border: rgba(124,58,237,0.3);
  --glow-shadow: rgba(124,58,237,0.1); --scrollbar-track: #1a1a2e;
  --scrollbar-thumb: #7c3aed; --modal-bg: #12121a; --modal-border: rgba(255,255,255,0.1);
  --badge-bg: rgba(255,255,255,0.05); --stat-bg: rgba(124,58,237,0.05);
}
body.light {
  --bg-primary: #f8f9fc; --bg-secondary: #ffffff; --bg-tertiary: #f1f3f9;
  --bg-card: #ffffff; --bg-input: #f1f3f9; --bg-hover: rgba(124,58,237,0.08);
  --bg-active: rgba(124,58,237,0.12); --text-primary: #1a1a2e; --text-secondary: #6b7280;
  --text-subtle: #9ca3af; --border-color: rgba(0,0,0,0.06);
  --card-border: rgba(0,0,0,0.08); --glow-border: rgba(124,58,237,0.2);
  --glow-shadow: rgba(124,58,237,0.05); --scrollbar-track: #f1f3f9;
  --scrollbar-thumb: #a78bfa; --modal-bg: #ffffff; --modal-border: rgba(0,0,0,0.1);
  --badge-bg: rgba(0,0,0,0.04); --stat-bg: rgba(124,58,237,0.05);
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); -webkit-tap-highlight-color: transparent; }
*::-webkit-scrollbar { width: 6px; }
*::-webkit-scrollbar-track { background: var(--scrollbar-track); }
*::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: var(--bg-primary); color: var(--text-primary); transition: background 0.3s, color 0.3s; }
.gradient-text { background: linear-gradient(135deg, #7c3aed, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.glow-border { border: 1px solid var(--glow-border); box-shadow: 0 0 15px var(--glow-shadow); }
.pulse-dot { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(1.2); } }
@keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.slide-in { animation: slideIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.fade-in { animation: fadeIn 0.2s ease-out; }
@keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
.slide-in-left { animation: slideInLeft 0.3s ease-out; }
@keyframes slideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.slide-up { animation: slideUp 0.2s ease-out; }
@keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
.slide-down { animation: slideDown 0.2s ease-out; }
@keyframes slideInRight { from { opacity:0; transform:translateX(100%); } to { opacity:1; transform:translateX(0); } }
.slide-in-right { animation: slideInRight 0.3s ease-out; }
@keyframes slideOutRight { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(100%); } }
.slide-out-right { animation: slideOutRight 0.3s ease-in forwards; }

.typing-indicator span { display:inline-block; width:6px; height:6px; border-radius:50%; background:#7c3aed; margin:0 2px; animation: typing 1.4s infinite; }
.typing-indicator span:nth-child(2) { animation-delay:0.2s; }
.typing-indicator span:nth-child(3) { animation-delay:0.4s; }
@keyframes typing { 0%,60%,100% { transform:translateY(0); opacity:0.4; } 30% { transform:translateY(-6px); opacity:1; } }
.chat-bubble-user { background: linear-gradient(135deg, #7c3aed, #5b21b6); color: white; }
.chat-bubble-ai { background: var(--bg-tertiary); border: 1px solid rgba(124,58,237,0.2); color: var(--text-primary); }
.chat-bubble-human { background: rgba(0,212,255,0.06); border: 1px solid rgba(0,212,255,0.18); color: var(--text-primary); }
.message-action { border:0; background:transparent; color:var(--text-secondary); padding:.3rem .45rem; border-radius:.35rem; cursor:pointer; font-size:.75rem; }
.message-action:hover { background:var(--bg-hover); color:var(--text-primary); }
.markdown-body { font-size:.9rem; line-height:1.7; color:var(--text-primary); }
.markdown-body > :first-child { margin-top:0; } .markdown-body > :last-child { margin-bottom:0; }
.markdown-body p { margin:.45rem 0 .8rem; } .markdown-body h1,.markdown-body h2,.markdown-body h3 { font-weight:650; line-height:1.3; margin:1rem 0 .5rem; }
.markdown-body h1 { font-size:1.25rem; } .markdown-body h2 { font-size:1.12rem; } .markdown-body h3 { font-size:1rem; }
.markdown-body ul,.markdown-body ol { padding-left:1.35rem; margin:.5rem 0 .85rem; } .markdown-body li { margin:.2rem 0; }
.markdown-body table { display:block; max-width:100%; overflow-x:auto; border-collapse:collapse; margin:.75rem 0; font-size:.82rem; }
.markdown-body th,.markdown-body td { border:1px solid var(--border-color); padding:.45rem .6rem; text-align:left; white-space:normal; }
.markdown-body th { text-transform:none; color:var(--text-primary); background:var(--bg-hover); }
.markdown-body pre { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--bg-primary); border:1px solid var(--border-color); border-radius:.5rem; padding:.75rem; overflow-x:auto; }
.markdown-body code { font-family:ui-monospace,monospace; font-size:.85em; background:var(--bg-hover); padding:.1rem .25rem; border-radius:.25rem; }
.markdown-body blockquote { border-left:3px solid #7c3aed; padding-left:.75rem; margin:.75rem 0; color:var(--text-secondary); }
.sidebar-item { transition: background 0.2s; color: var(--text-secondary); }
.sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-item.active { background: var(--bg-active); border-left: 3px solid #7c3aed; color: #a78bfa; }
.card { background: var(--bg-card); border: 1px solid var(--card-border); border-radius: 0.75rem; color: var(--text-primary); }
.btn-primary { background: linear-gradient(135deg, #7c3aed, #00d4ff); color: white; border: none; cursor: pointer; }
.btn-primary:hover { opacity: 0.9; }
.btn-secondary { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); cursor: pointer; }
.btn-secondary:hover { background: var(--bg-hover); }
.btn-danger { background: rgba(255,0,110,0.1); border: 1px solid rgba(255,0,110,0.3); color: #ff006e; cursor: pointer; }
.btn-danger:hover { background: rgba(255,0,110,0.2); }
.btn-success { background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.3); color: #00ff88; cursor: pointer; }
.btn-warning { background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.3); color: #eab308; cursor: pointer; }
.btn-google { background: #ffffff; color: #1a1a2e; border: 1px solid rgba(0,0,0,0.1); cursor: pointer; font-weight: 500; }
.btn-google:hover { background: #f8f9fc; }
.input-field { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); outline: none; }
.input-field:focus { border-color: #7c3aed; }
.input-field::placeholder { color: var(--text-subtle); }
.text-muted { color: var(--text-secondary); }
.text-subtle { color: var(--text-subtle); }
.border-subtle { border-color: var(--border-color); }
.plan-badge { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.625rem; font-weight: 600; text-transform: uppercase; }
.plan-free { background: rgba(107,114,128,0.15); color: #9ca3af; }
.plan-pro { background: rgba(124,58,237,0.15); color: #a78bfa; }
.plan-enterprise { background: rgba(0,212,255,0.15); color: #00d4ff; }
.plan-banned { background: rgba(255,0,110,0.15); color: #ff006e; }
.plan-restricted { background: rgba(234,179,8,0.15); color: #eab308; }
.key-status-active { background: rgba(0,255,136,0.1); color: #00ff88; }
.key-status-paused { background: rgba(234,179,8,0.1); color: #eab308; }
.key-status-blocked { background: rgba(255,0,110,0.1); color: #ff006e; }
.key-status-expired { background: rgba(107,114,128,0.15); color: #9ca3af; }
.tab-btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; background: transparent; border: none; color: var(--text-secondary); }
.tab-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.tab-btn.active { background: var(--bg-active); color: #a78bfa; }
.faq-item { border-bottom: 1px solid var(--border-color); }
.action-btn { padding: 0.375rem 0.625rem; border-radius: 0.375rem; font-size: 0.75rem; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.25rem; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 0.75rem 1rem; font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
td { padding: 0.875rem 1rem; font-size: 0.875rem; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
tr:hover td { background: var(--bg-hover); }
.divider { display: flex; align-items: center; gap: 0.75rem; margin: 1rem 0; color: var(--text-subtle); font-size: 0.75rem; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
.google-icon { display: inline-flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem; margin-right: 0.5rem; }
.api-key-display { font-family: 'Courier New', monospace; background: var(--bg-tertiary); padding: 0.5rem 0.75rem; border-radius: 0.375rem; font-size: 0.8125rem; letter-spacing: 0.5px; }
.doc-section { border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
.endpoint-badge { display: inline-flex; padding: 0.25rem 0.625rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600; font-family: monospace; }
.method-get { background: rgba(0,212,255,0.15); color: #00d4ff; }
.method-post { background: rgba(0,255,136,0.15); color: #00ff88; }
.method-put { background: rgba(234,179,8,0.15); color: #eab308; }
.method-delete { background: rgba(255,0,110,0.15); color: #ff006e; }
.method-patch { background: rgba(124,58,237,0.15); color: #a78bfa; }
.code-block { background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 1rem; font-family: 'Courier New', monospace; font-size: 0.8125rem; overflow-x: auto; margin: 0.75rem 0; white-space: pre; }
.credit-card-option { background: var(--bg-input); border: 2px solid var(--border-color); border-radius: 0.75rem; padding: 1rem; cursor: pointer; transition: all 0.2s; }
.credit-card-option:hover { border-color: rgba(124,58,237,0.4); }
.credit-card-option.selected { border-color: #7c3aed; background: rgba(124,58,237,0.1); }
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease-out;
}
.modal-box {
  position: relative; background: var(--modal-bg); border: 1px solid var(--modal-border);
  border-radius: 1rem; padding: 2rem; max-width: 36rem; width: 90%;
  color: var(--text-primary); max-height: 90vh; overflow-y: auto; z-index: 1001;
}
.modal-close-x {
  position: absolute; top: 1rem; right: 1rem; background: transparent; border: none;
  color: var(--text-secondary); cursor: pointer; padding: 0.5rem; border-radius: 0.375rem;
  display: flex; align-items: center; justify-content: center; z-index: 1002;
}
.modal-close-x:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-backdrop {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
  z-index: 40; animation: fadeIn 0.2s ease-out;
}

/* SIDEBAR */
.app-sidebar {
  width: 16rem; background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex; flex-direction: column; flex-shrink: 0;
  transition: width 0.3s ease, transform 0.3s ease;
  overflow: hidden;
}

/* DESKTOP COLLAPSED STATE */
.app-sidebar.desktop-collapsed {
  width: 4rem;
}
.app-sidebar.desktop-collapsed .sidebar-text,
.app-sidebar.desktop-collapsed .sidebar-label,
.app-sidebar.desktop-collapsed .user-info-text,
.app-sidebar.desktop-collapsed .new-chat-text,
.app-sidebar.desktop-collapsed .theme-logout-text,
.app-sidebar.desktop-collapsed .user-popover-trigger-text {
  display: none !important;
  width: 0;
  overflow: hidden;
  white-space: nowrap;
}
.app-sidebar.desktop-collapsed .sidebar-item {
  justify-content: center;
  padding: 0.625rem;
  border-left: none;
}
.app-sidebar.desktop-collapsed .sidebar-item.active {
  border-left: none;
  background: var(--bg-active);
}
.app-sidebar.desktop-collapsed nav {
  padding: 0.5rem;
}
.app-sidebar.desktop-collapsed .recent-chats-scroll {
  display: none;
}
.app-sidebar.desktop-collapsed .user-section-trigger {
  justify-content: center;
  padding: 0.5rem;
}
.app-sidebar.desktop-collapsed .theme-logout-btns {
  flex-direction: column;
}
.app-sidebar.desktop-collapsed .theme-logout-btns .btn-secondary {
  justify-content: center;
}
.app-sidebar.desktop-collapsed .section-divider {
  display: none;
}
.app-sidebar.desktop-collapsed .sidebar-section-label {
  display: none;
}

/* MOBILE SIDEBAR */
.app-sidebar.mobile-hidden {
  position: fixed; top: 4rem; left: 0; bottom: 0;
  z-index: 45; transform: translateX(-100%);
  border-right: 1px solid var(--border-color);
  box-shadow: 4px 0 20px rgba(0,0,0,0.3);
}
.app-sidebar.mobile-visible {
  position: fixed; top: 4rem; left: 0; bottom: 0;
  z-index: 45; transform: translateX(0);
  border-right: 1px solid var(--border-color);
  box-shadow: 4px 0 20px rgba(0,0,0,0.3);
}

/* User popover */
.user-popover {
  position: absolute;
  bottom: 100%;
  left: 0.5rem;
  right: 0.5rem;
  margin-bottom: 0.5rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 0.75rem;
  padding: 0.5rem;
  z-index: 60;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  animation: slideUp 0.2s ease-out;
  max-height: 70vh;
  overflow-y: auto;
}
.user-popover-item {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.625rem 0.75rem; border-radius: 0.5rem;
  cursor: pointer; color: var(--text-primary);
  font-size: 0.875rem; transition: background 0.15s;
}
.user-popover-item:hover { background: var(--bg-hover); }
.user-popover-divider { height: 1px; background: var(--border-color); margin: 0.375rem 0; }

/* Notifications dropdown */
.notif-dropdown {
  position: absolute;
  top: 3.5rem;
  right: 1rem;
  width: 20rem;
  max-height: 24rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 0.75rem;
  padding: 0.5rem;
  z-index: 60;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  animation: slideDown 0.2s ease-out;
  overflow-y: auto;
}
.notif-item {
  display: flex; align-items: flex-start; gap: 0.75rem;
  padding: 0.75rem; border-radius: 0.5rem;
  cursor: pointer; transition: background 0.15s;
}
.notif-item:hover { background: var(--bg-hover); }
.notif-item.unread { background: rgba(124,58,237,0.05); }

/* TOAST NOTIFICATIONS */
.toast-container {
  position: fixed;
  top: 5rem;
  right: 1rem;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 0.75rem;
  padding: 0.875rem 1rem;
  min-width: 280px;
  max-width: 360px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  gap: 0.75rem;
  animation: slideInRight 0.3s ease-out;
}
.toast.removing {
  animation: slideOutRight 0.3s ease-in forwards;
}
.toast-icon {
  width: 2rem;
  height: 2rem;
  border-radius: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.toast-success .toast-icon { background: rgba(0,255,136,0.15); color: #00ff88; }
.toast-error .toast-icon { background: rgba(255,0,110,0.15); color: #ff006e; }
.toast-info .toast-icon { background: rgba(0,212,255,0.15); color: #00d4ff; }
.toast-warning .toast-icon { background: rgba(234,179,8,0.15); color: #eab308; }
.toast-content { flex: 1; min-width: 0; }
.toast-title { font-size: 0.875rem; font-weight: 600; color: var(--text-primary); margin: 0 0 0.125rem 0; }
.toast-message { font-size: 0.8125rem; color: var(--text-secondary); margin: 0; line-height: 1.4; }
.toast-close {
  background: transparent;
  border: none;
  color: var(--text-subtle);
  cursor: pointer;
  padding: 0.25rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.toast-close:hover { color: var(--text-primary); }

/* PROMPT MODAL */
.prompt-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
  z-index: 1500; display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease-out;
}
.prompt-box {
  position: relative; background: var(--modal-bg); border: 1px solid var(--modal-border);
  border-radius: 1rem; padding: 1.5rem; max-width: 28rem; width: 90%;
  color: var(--text-primary); z-index: 1501;
  animation: slideIn 0.2s ease-out;
}

.sidebar-section-label {
  font-size: 0.6875rem;
  font-weight: 600;
  color: var(--text-subtle);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0.5rem 0.75rem 0.25rem 0.75rem;
  margin: 0;
}

@media (max-width: 767px) {
  .nav-user-pill { display: none !important; }
  .nav-bell-btn { padding: 0.5rem !important; }
  .app-sidebar.mobile-hidden,
  .app-sidebar.mobile-visible {
    position: fixed; transform: translateX(-100%); z-index: 45;
    top: 4rem; left: 0; bottom: 0; width: 16rem;
    box-shadow: 4px 0 20px rgba(0,0,0,0.3);
  }
  .app-sidebar.mobile-visible { transform: translateX(0); }
  .app-sidebar.desktop-collapsed { width: 16rem; }
  .app-sidebar.desktop-collapsed .sidebar-text,
  .app-sidebar.desktop-collapsed .sidebar-label,
  .app-sidebar.desktop-collapsed .user-info-text,
  .app-sidebar.desktop-collapsed .new-chat-text,
  .app-sidebar.desktop-collapsed .theme-logout-text,
  .app-sidebar.desktop-collapsed .user-popover-trigger-text {
    display: inline !important;
    width: auto !important;
  }
  .app-sidebar.desktop-collapsed .sidebar-item {
    justify-content: flex-start;
    padding: 0.625rem 0.75rem;
  }
  .app-sidebar.desktop-collapsed .sidebar-item.active {
    border-left: 3px solid #7c3aed;
  }
  .app-sidebar.desktop-collapsed nav { padding: 0.75rem; }
  .app-sidebar.desktop-collapsed .recent-chats-scroll { display: flex; }
  .app-sidebar.desktop-collapsed .user-section-trigger {
    justify-content: flex-start;
    padding: 0.5rem;
  }
  .app-sidebar.desktop-collapsed .theme-logout-btns { flex-direction: row; }
  .app-sidebar.desktop-collapsed .theme-logout-btns .btn-secondary { justify-content: center; }
  .app-sidebar.desktop-collapsed .theme-logout-btns .btn-secondary span { display: inline; }
  .app-sidebar.desktop-collapsed .section-divider { display: block; }
  .app-sidebar.desktop-collapsed .sidebar-section-label { display: block; }
  main { height: calc(100vh - 4rem) !important; overflow: hidden; }
  .chat-scroll-container {
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .content-scroll {
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .user-popover { left: 0.5rem; right: 0.5rem; }
  .notif-dropdown { right: 0.5rem; width: calc(100vw - 1rem); }
  .toast-container { right: 0.5rem; left: 0.5rem; }
  .toast { min-width: auto; max-width: none; }
}

@media (min-width: 768px) {
  .sidebar-backdrop { display: none !important; }
  main { height: calc(100vh - 4rem) !important; overflow: hidden; }
  .content-scroll {
    overflow-y: auto;
    overscroll-behavior: contain;
  }
}

.chat-scroll-container {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.content-scroll {
  overflow-y: auto;
  overscroll-behavior: contain;
}
</style>
</head>

// ============ TOAST NOTIFICATION SYSTEM ============
function showToast(message, type = 'info', title = '') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  
  const icons = {
    success: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
    error: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
    info: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
    warning: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
  };
  
  const defaultTitles = {
    success: 'Success',
    error: 'Error',
    info: 'Info',
    warning: 'Warning'
  };
  
  const displayTitle = title || defaultTitles[type];
  
  toast.innerHTML = `
    <div class="toast-icon">${icons[type]}</div>
    <div class="toast-content">
      <p class="toast-title">${displayTitle}</p>
      <p class="toast-message">${message}</p>
    </div>
    <button class="toast-close" onclick="this.parentElement.remove()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  `;
  
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add('removing');
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// ============ CUSTOM PROMPT MODAL ============
function showPrompt(title, placeholder, callback, defaultValue = '') {
  const overlay = document.createElement('div');
  overlay.className = 'prompt-overlay';
  overlay.innerHTML = `
    <div class="prompt-box">
      <h3 style="font-weight:600;color:var(--text-primary);margin:0 0 1rem 0;font-size:1.125rem">${title}</h3>
      <input type="text" id="prompt-input" placeholder="${placeholder}" value="${defaultValue}" 
        class="input-field" style="width:100%;padding:0.75rem;border-radius:0.5rem;font-size:0.875rem;margin-bottom:1rem">
      <div style="display:flex;gap:0.75rem;justify-content:flex-end">
        <button id="prompt-cancel" class="btn-secondary" style="padding:0.625rem 1rem;border-radius:0.5rem;font-size:0.875rem;font-weight:500">Cancel</button>
        <button id="prompt-ok" class="btn-primary" style="padding:0.625rem 1rem;border-radius:0.5rem;font-size:0.875rem;font-weight:500">OK</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  
  const input = overlay.querySelector('#prompt-input');
  const okBtn = overlay.querySelector('#prompt-ok');
  const cancelBtn = overlay.querySelector('#prompt-cancel');
  
  setTimeout(() => input.focus(), 50);
  
  function close() { overlay.remove(); }
  
  okBtn.onclick = () => {
    const value = input.value.trim();
    close();
    if (callback) callback(value);
  };
  
  cancelBtn.onclick = () => {
    close();
    if (callback) callback(null);
  };
  
  input.onkeydown = (e) => {
    if (e.key === 'Enter') okBtn.click();
    if (e.key === 'Escape') cancelBtn.click();
  };
  
  overlay.onclick = (e) => {
    if (e.target === overlay) cancelBtn.click();
  };
}

// ============ SCROLL & FOCUS PRESERVATION ============
const scrollState = { containers: {} };
const focusState = { id: null, start: 0, end: 0 };

function saveScrollState() {
  document.querySelectorAll('.content-scroll, .chat-scroll-container, .recent-chats-scroll').forEach(el => {
    const key = el.id || ('scroll_' + (el.parentElement?.id || ''));
    scrollState.containers[key] = el.scrollTop;
  });
}

function saveFocusState() {
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) {
    focusState.id = active.id;
    focusState.start = active.selectionStart || 0;
    focusState.end = active.selectionEnd || 0;
    focusState.tagName = active.tagName;
    focusState.type = active.type;
  } else {
    focusState.id = null;
  }
}

function restoreScrollState() {
  document.querySelectorAll('.content-scroll, .chat-scroll-container, .recent-chats-scroll').forEach(el => {
    const key = el.id || ('scroll_' + (el.parentElement?.id || ''));
    if (scrollState.containers[key] !== undefined) {
      el.scrollTop = scrollState.containers[key];
    }
  });
}

function restoreFocusState() {
  if (focusState.id) {
    const el = document.getElementById(focusState.id);
    if (el && el.tagName === focusState.tagName) {
      el.focus();
      if (el.setSelectionRange && focusState.type !== 'number') {
        try { el.setSelectionRange(focusState.start, focusState.end); } catch(e) {}
      } else if (focusState.type === 'number') {
        el.select();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    }
  }
}

function renderModal(content) {
  return `<div class="modal-overlay" id="active-modal"><div class="modal-box">${content}</div></div>`;
}

function render() {
  saveScrollState();
  saveFocusState();
  
  document.body.className = state.theme;
  const app = document.getElementById('app');
  let html = '';
  const isAdminView = state.currentRole === 'admin' && (state.currentView === 'admin-dashboard' || state.currentView === 'admin-chat');
  const isUserView = !isAdminView && state.currentView !== 'landing' && state.currentView !== 'admin-login';
  
  if (isUserView || isAdminView) html += renderNavbar();
  if (state.currentView === 'landing') html += renderLanding();
  else if (state.currentView === 'user-chat') html += renderUserChat();
  else if (state.currentView === 'user-all-chats') html += renderUserAllChats();
  else if (state.currentView === 'user-coder') html += renderUserCoder();
  else if (state.currentView === 'user-profile') html += renderUserProfile();
  else if (state.currentView === 'user-plans') html += renderUserPlans();
  else if (state.currentView === 'user-api-keys') html += renderApiKeys();
  else if (state.currentView === 'user-api-docs') html += renderApiDocs();
  else if (state.currentView === 'user-help') html += renderUserHelp();
  else if (state.currentView === 'user-settings') html += renderUserSettings();
  else if (state.currentView === 'user-projects') html += renderProjects();
  else if (state.currentView === 'user-community') html += renderCommunity();
  else if (state.currentView === 'user-create') html += renderCreate();
  else if (state.currentView === 'admin-login') html += renderAdminLogin();
  else if (state.currentView === 'admin-dashboard') html += renderAdminDashboard();
  else if (state.currentView === 'admin-chat') html += renderAdminChat();
  
  if (state.showAuthModal) html += renderAuthModal();
  if (state.showUpgradeModal) html += renderUpgradeModal();
  if (state.showDeleteModal) html += renderDeleteModal();
  if (state.showUserActionModal) html += renderUserActionModal();
  if (state.showCreateKeyModal) html += renderCreateKeyModal();
  if (state.showRechargeModal) html += renderRechargeModal();
  if (state.showKeyActionModal) html += renderKeyActionModal();
  
  app.innerHTML = html;
  
  requestAnimationFrame(() => {
    restoreScrollState();
    restoreFocusState();
  });
  
  attachEventListeners();
}

function closeModal() {
  state.showAuthModal = null;
  state.showUpgradeModal = null;
  state.showDeleteModal = false;
  state.showUserActionModal = null;
  state.showCreateKeyModal = false;
  state.showRechargeModal = false;
  state.showKeyActionModal = null;
  state.selectedCreditPackage = null;
  render();
}

function toggleSidebar() {
  if (window.innerWidth < 768) {
    state.sidebarOpen = !state.sidebarOpen;
    state.userMenuOpen = false;
    state.notifOpen = false;
  } else {
    state.sidebarCollapsed = !state.sidebarCollapsed;
  }
  render();
}

function closeSidebar() {
  state.sidebarOpen = false;
  state.userMenuOpen = false;
  render();
}

function toggleUserMenu() {
  state.userMenuOpen = !state.userMenuOpen;
  state.notifOpen = false;
  render();
}

function toggleNotif() {
  state.notifOpen = !state.notifOpen;
  state.userMenuOpen = false;
  render();
}

function nav(view) {
  navigateTo(view);
  state.sidebarOpen = false;
  state.userMenuOpen = false;
}

  const raw = String(content || '');
  if (window.marked && window.DOMPurify) return window.DOMPurify.sanitize(window.marked.parse(raw, { gfm: true, breaks: true }));
  return escapeHtml(raw).replace(/\n/g, '<br>');
}
function renderMessage(msg) {

  if (msg.role === 'ai') return `<div class="slide-in" style="display:flex;align-items:flex-start;gap:.75rem;max-width:100%"><div style="width:2rem;height:2rem;border-radius:.5rem;background:rgba(124,58,237,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#a78bfa">${I.robot}</div><div style="min-width:0;max-width:min(100%,54rem);flex:1"><div class="chat-bubble-ai" style="border-radius:1rem;border-top-left-radius:.25rem;padding:1rem 1.1rem;overflow-wrap:anywhere"><div class="message-body markdown-body">${renderMarkdown(msg.content)}</div><p style="font-size:.625rem;color:var(--text-subtle);margin-top:.65rem">${safeTime}</p></div><div style="display:flex;gap:.25rem;margin-top:.35rem;align-items:center"><button class="message-action" title="Copy response" aria-label="Copy response" onclick="copyChatMessage('${messageId}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg></button><button class="message-action" title="${state.messageFeedback?.[messageId]?'You have already rated this response':'Helpful'}" aria-label="Helpful" ${state.messageFeedback?.[messageId]?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="rateAssistantMessage('${messageId}','like')"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v11H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3z"></path><path d="M7 10l5-7a3 3 0 0 1 2 3v4h4a3 3 0 0 1 3 3l-1.5 6a3 3 0 0 1-3 2H7"></path></svg></button><button class="message-action" title="${state.messageFeedback?.[messageId]?'You have already rated this response':'Not helpful'}" aria-label="Not helpful" ${state.messageFeedback?.[messageId]?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="rateAssistantMessage('${messageId}','dislike')"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14V3H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3z"></path><path d="M7 14l5 7a3 3 0 0 0 2-3v-4h4a3 3 0 0 0 3-3l-1.5-6a3 3 0 0 0-3-2H7"></path></svg></button></div></div></div>`;
  if (msg.role === 'human') return `<div class="slide-in" style="display:flex;align-items:flex-start;gap:.75rem"><div style="width:2rem;height:2rem;border-radius:.5rem;background:rgba(0,212,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#00a8cc">${I.userStar}</div><div class="chat-bubble-human" style="border-radius:1rem;border-top-left-radius:.25rem;padding:.9rem 1rem;max-width:min(100%,54rem);overflow-wrap:anywhere"><div style="font-size:.75rem;font-weight:600;color:#00a8cc;margin-bottom:.35rem">Human support</div><div style="font-size:.9rem;line-height:1.65;white-space:pre-wrap">${safeContent}</div><p style="font-size:.625rem;color:var(--text-subtle);margin-top:.5rem">${safeTime}</p></div></div>`;

}
function copyChatMessage(messageId) {
  const message = state.chatMessages.find(m => String(m.id || '').replace(/[^a-zA-Z0-9_-]/g, '') === messageId);
  if (!message) return;
  navigator.clipboard.writeText(message.content || '').then(() => showToast(message.role === 'user' ? 'Message copied.' : 'Response copied.', 'success')).catch(() => showToast('Could not copy. Select and copy the text manually.', 'error'));
}
async function rateAssistantMessage(messageId, rating) {
  state.messageFeedback = state.messageFeedback || {};
  if (state.messageFeedback[messageId]) {
    showToast('You have already rated this response.', 'info');
    return;
  }
  const user = window.firebaseAuth.currentUser;
  if (!user) { showToast('Sign in to rate responses.', 'warning'); return; }
  state.messageFeedback[messageId] = 'saving';
  render();
  try {
    const feedbackRef = window.firebaseDb.collection('users').doc(user.uid).collection('feedback').doc(messageId);
    await window.firebaseDb.runTransaction(async transaction => {
      const existing = await transaction.get(feedbackRef);
      if (existing.exists) {
        const alreadyRated = new Error('You have already rated this response.');
        alreadyRated.code = 'already-rated';
        throw alreadyRated;
      }
      transaction.set(feedbackRef, { messageId, rating, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    state.messageFeedback[messageId] = rating;
    showToast(rating === 'like' ? 'Thanks for the feedback.' : 'Thanks. We’ll use that feedback to improve.', 'success');
  } catch (error) {
    delete state.messageFeedback[messageId];
    if (error.code === 'already-rated' || error.code === 'already-exists' || error.code === 6 || /permission-denied/i.test(error.code || '')) showToast('You have already rated this response.', 'info');
    else showToast('Could not save your rating. Please try again.', 'error');
    render();
  }
}

function renderApiKeys() {
  const tabs = [{ id: 'keys', label: 'API Keys', icon: I.key },{ id: 'recharge', label: 'Recharge Tokens', icon: I.wallet }];
  const activeKeys = state.apiKeys.filter(k => k.status === 'active').length;
  const pausedKeys = state.apiKeys.filter(k => k.status === 'paused').length;
  const blockedKeys = state.apiKeys.filter(k => k.status === 'blocked').length;
  const expiredKeys = state.apiKeys.filter(k => k.status === 'expired').length;
  const totalUsed = state.apiKeys.reduce((sum, k) => sum + k.used, 0);
  return `<main style="padding-top:4rem;height:100vh;display:flex;overflow:hidden">${renderSidebar(false)}<div class="content-scroll" style="flex:1;min-width:0" id="main-scroll"><div style="padding:1.5rem;max-width:72rem"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem"><div><h2 style="font-size:1.5rem;font-weight:bold;color:var(--text-primary)">API Keys</h2><p style="color:var(--text-secondary);font-size:0.875rem">Manage your API keys and token balance</p></div><div style="display:flex;gap:0.75rem;flex-wrap:wrap"><button onclick="openRechargeModal()" class="btn-secondary" style="padding:0.625rem 1rem;border-radius:0.5rem;font-size:0.875rem;display:flex;align-items:center;gap:0.5rem">${I.wallet} Recharge</button><button onclick="openCreateKeyModal()" class="btn-primary" style="padding:0.625rem 1rem;border-radius:0.5rem;font-size:0.875rem;display:flex;align-items:center;gap:0.5rem">${I.plus} Create Key</button></div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:2rem">${renderApiStat('Total Balance', `${state.totalBalance.toLocaleString()} credits`, I.coins)}${renderApiStat('Active Keys', activeKeys, I.key)}${renderApiStat('Paused', pausedKeys, I.pause)}${renderApiStat('Blocked', blockedKeys, I.ban)}${renderApiStat('Expired', expiredKeys, I.clock)}${renderApiStat('Total Used', totalUsed.toLocaleString(), I.zap)}</div><div style="display:flex;gap:0.5rem;margin-bottom:1.5rem;flex-wrap:wrap">${tabs.map(t => `<button onclick="setApiTab('${t.id}')" class="tab-btn ${state.apiTab === t.id ? 'active' : ''}" style="display:flex;align-items:center;gap:0.5rem">${t.icon} ${t.label}</button>`).join('')}</div>${state.apiTab === 'keys' ? renderApiKeysList() : renderRechargeSection()}</div></div></main>`;
}

function renderApiStat(label, value, icon) { return `<div class="card" style="padding:1rem"><div style="display:flex;align-items:center;gap:0.5rem;color:#a78bfa;margin-bottom:0.5rem">${icon}<span style="font-size:0.75rem">${label}</span></div><p style="font-size:1.25rem;font-weight:bold;color:var(--text-primary)">${value}</p></div>`; }

function renderApiKeysList() {
  if (state.apiKeys.length === 0) {
    return `<div class="card" style="padding:3rem;text-align:center"><div style="width:3rem;height:3rem;border-radius:0.75rem;background:rgba(124,58,237,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;color:#a78bfa">${I.key}</div><h3 style="font-weight:600;color:var(--text-primary);margin-bottom:0.5rem">No API keys yet</h3><p style="color:var(--text-secondary);font-size:0.875rem;margin-bottom:1.5rem">Create your first API key to start integrating</p><button onclick="openCreateKeyModal()" class="btn-primary" style="padding:0.625rem 1.25rem;border-radius:0.5rem;font-size:0.875rem">${I.plus} Create Key</button></div>`;
  }
  return `<div class="card glow-border" style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Key</th><th>Tokens</th><th>Created</th><th>Expires</th><th>Status</th><th>Last Used</th><th>Actions</th></tr></thead><tbody>${state.apiKeys.map(k => {
    const maskedKey = k.key.substring(0, 10) + '••••••••••••' + k.key.substring(k.key.length - 6);

    return `<tr><td><div style="display:flex;align-items:center;gap:0.5rem"><div style="width:1.75rem;height:1.75rem;border-radius:0.375rem;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;color:var(--text-secondary)">${I.key}</div><div><p style="font-weight:500;color:var(--text-primary)">${k.name}</p>${isExpiringSoon ? `<p style="font-size:0.6875rem;color:#eab308">Expiring soon</p>` : ''}</div></div></td><td><span class="api-key-display" style="color:var(--text-secondary)">${maskedKey}</span><button onclick="copyKey('${k.id}')" style="margin-left:0.5rem;background:transparent;border:none;color:var(--text-secondary);cursor:pointer;vertical-align:middle" title="Copy">${I.copy}</button></td><td><div style="min-width:80px"><div style="display:flex;justify-content:space-between;font-size:0.75rem;margin-bottom:0.25rem"><span style="color:var(--text-primary)">${k.used.toLocaleString()}</span><span style="color:var(--text-subtle)">/ ${k.tokens.toLocaleString()}</span></div><div style="height:0.25rem;background:var(--border-color);border-radius:9999px;overflow:hidden"><div style="height:100%;width:${tokensPct}%;background:${tokensPct > 90 ? '#ff006e' : tokensPct > 70 ? '#eab308' : '#00ff88'};border-radius:9999px"></div></div></div></td><td style="font-size:0.8125rem;color:var(--text-secondary)">${k.created}</td><td style="font-size:0.8125rem;color:${isExpiringSoon ? '#eab308' : 'var(--text-secondary)'}">${k.expiry || 'Never'}</td><td><span class="plan-badge ${statusClass}" style="text-transform:capitalize">${k.status}</span></td><td style="font-size:0.8125rem;color:var(--text-subtle)">${k.lastUsed}</td><td><div style="display:flex;gap:0.25rem;flex-wrap:wrap">${k.status === 'active' ? `<button onclick="openKeyAction('${k.id}','pause')" class="btn-warning action-btn" title="Pause">${I.pause}</button>` : k.status === 'paused' ? `<button onclick="openKeyAction('${k.id}','resume')" class="btn-success action-btn" title="Resume">${I.play}</button>` : ''}${k.status !== 'blocked' ? `<button onclick="openKeyAction('${k.id}','block')" class="btn-danger action-btn" title="Block">${I.ban}</button>` : `<button onclick="openKeyAction('${k.id}','unblock')" class="btn-success action-btn" title="Unblock">${I.check}</button>`}<button onclick="openKeyAction('${k.id}','regenerate')" class="btn-secondary action-btn" title="Regenerate">${I.refresh}</button><button onclick="openKeyAction('${k.id}','delete')" class="btn-danger action-btn" title="Delete">${I.trash}</button></div></td></tr>`;
  }).join('')}</tbody></table></div>`;
}

dius:0.5rem;font-size:0.875rem" oninput="updateCustomCreditsDirect(this)"></div><div style="flex:1;min-width:140px"><label style="font-size:0.75rem;color:var(--text-secondary);display:block;margin-bottom:0.25rem">Estimated Price</label><div id="custom-price-display" style="padding:0.625rem 0.75rem;background:var(--bg-tertiary);border-radius:0.5rem;font-size:0.875rem;color:var(--text-primary);min-height:2.25rem;display:flex;align-items:center">$${priceDisplay}</div></div></div><p style="font-size:0.75rem;color:var(--text-subtle);margin-top:0.5rem">Minimum 100 credits. Rate: $0.0015 per credit</p></div>${rechargeAmount ? `<button onclick="processRecharge()" class="btn-primary recharge-btn-dynamic" style="width:100%;padding:0.875rem;border-radius:0.5rem;font-weight:600;font-size:1rem">${I.wallet} Recharge ${rechargeAmount.toLocaleString()} Credits — $${rechargePrice}</button>` : `<button class="btn-secondary recharge-btn-dynamic" style="width:100%;padding:0.875rem;border-radius:0.5rem;font-weight:600;font-size:1rem;opacity:0.5;cursor:not-allowed" disabled>Select a package or enter custom amount</button>`}</div>`;

function renderToggle(label, desc, value, key) { return `<div style="display:flex;align-items:center;justify-content:space-between;padding:1rem;background:var(--stat-bg);border-radius:0.5rem;gap:1rem"><div style="flex:1;min-width:0"><p style="font-size:0.875rem;font-weight:500;color:var(--text-primary)">${label}</p><p style="font-size:0.75rem;color:var(--text-subtle)">${desc}</p></div><button onclick="toggleDataControl('${key}')" style="width:2.75rem;height:1.5rem;border-radius:9999px;background:${value ? '#7c3aed' : 'var(--border-color)'};border:none;cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0"><div style="width:1.125rem;height:1.125rem;border-radius:9999px;background:white;position:absolute;top:0.1875rem;${value ? 'right:0.1875rem' : 'left:0.1875rem'};transition:left 0.2s,right 0.2s"></div></button></div>`; }

function renderUsageSettings() { const limits = { free: { messages: 50, humanRequests: 0, coder: false, api: false }, pro: { messages: 'Unlimited', humanRequests: 'Unlimited', coder: true, api: false }, enterprise: { messages: 'Unlimited', humanRequests: 'Unlimited', coder: true, api: true } }; const current = limits[state.currentPlan]; return `<div class="card" style="padding:1.5rem;margin-bottom:1rem"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem"><h4 style="font-weight:600;color:var(--text-primary)">Current Usage</h4><span class="plan-badge plan-${state.currentPlan}">${state.currentPlan}</span></div><div style="display:flex;flex-direction:column;gap:1rem">${renderUsageBar('Messages Today', state.messagesToday, 50, state.currentPlan === 'free')}${renderUsageBar('Human Requests', state.humanRequestsUsed, 5, state.currentPlan === 'free')}</div></div><div class="card" style="padding:1.5rem"><h4 style="font-weight:600;margin-bottom:1rem;color:var(--text-primary)">Plan Limits</h4><div style="display:flex;flex-direction:column;gap:0.75rem"><div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem;flex-wrap:wrap;gap:0.5rem"><span style="font-size:0.875rem;color:var(--text-primary)">Daily Messages</span><span style="font-size:0.875rem;font-weight:500;color:var(--text-primary)">${current.messages}</span></div><div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem;flex-wrap:wrap;gap:0.5rem"><span style="font-size:0.875rem;color:var(--text-primary)">Human Expert Requests</span><span style="font-size:0.875rem;font-weight:500;color:var(--text-primary)">${current.humanRequests}</span></div><div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem;background:var(--stat-bg);border-radius:0.5rem;flex-wrap:wrap;gap:0.5re async function loadAdminFirestoreData(){if(!window.firebaseDb||!window.firebaseAuth.currentUser)return;if(state.adminUsersUnsubscribe)state.adminUsersUnsubscribe();if(state.adminCreditRequestsUnsubscribe)state.adminCreditRequestsUnsubscribe();if(state.adminSettingsUnsubscribe)state.adminSettingsUnsubscribe();state.adminChatUnsubscribes.forEach(fn=>fn());state.adminChatUnsubscribes=[];state.adminDataError='';state.adminUsersUnsubscribe=window.firebaseDb.collection('users').onSnapshot(async snap=>{state.adminUsers=snap.docs.map(d=>{const x=d.data(),p=String(x.plan||'free');return {...x,id:d.id,uid:d.id,name:x.displayName||x.name||x.email||'User',plan:p.charAt(0).toUpperCase()+p.slice(1),accountStatus:x.accountStatus||'active',customLimits:x.customLimits||null,messagesToday:0,apiCalls:0};});const usageDay=new Date().toISOString().slice(0,10);await Promise.all(state.adminUsers.map(async u=>{try{const usageSnap=await window.firebaseDb.collection('users').doc(u.uid).collection('usage').doc(usageDay).get();const usage=usageSnap.data()||{};u.messagesToday=Number(usage.messageCount||0);u.apiCalls=Number(usage.apiCalls||0);}catch(e){console.warn('Could not load user usage',e);}}));state.adminDataLoaded=true;(state.adminChatUnsubscribes||[]).forEach(fn=>fn());state.adminChatUnsubscribes=[];state.adminChats=[];state.adminUsers.forEach(u=>{const unsub=window.firebaseDb.collection('users').doc(u.uid).collection('chats').onSnapshot(cs=>{const chats=cs.docs.map(d=>({...d.data(),id:d.id,ownerUid:u.uid,ownerEmail:u.email||''}));state.adminChats=[...state.adminChats.filter(c=>c.ownerUid!==u.uid),...chats];render();},e=>console.warn('Chat listener',e));state.adminChatUnsubscribes.push(unsub);});render();},e=>{console.error(e);state.adminDataError='Could not load users from Firestore. Check admin permissions.';render();});state.adminCreditRequestsUnsubscribe=window.firebaseDb.collection('creditRequests').orderBy('createdAt','desc').onSnapshot(snap=>{state.adminCreditRequests=snap.docs.map(d=>({...d.data(),id:d.id}));render();},e=>{console.error(e);state.adminDataError='Could not load credit requests. Check Firestore rules.';render();});state.adminSettingsUnsubscribe=window.firebaseDb.collection('appSettings').doc('global').onSnapshot(d=>{if(d.exists)state.adminSettings={...state.adminSettings,...d.data()};render();},e=>console.warn('Settings listener',e));}async function approveCreditRequest(requestId) {
  if (window.__creditActionBusy) { showToast('A credit request action is already processing. Please wait.', 'info'); return; }
  window.__creditActionBusy = true;
  const user = window.firebaseAuth.currentUser; if (!user) { showToast('Sign in with the administrator account first.', 'error'); return; }
  try { const token = await user.getIdTokenResult(true); if (token.claims.admin !== true) throw new Error('Administrator permission is required.');
    await window.firebaseDb.runTransaction(async transaction => {
      const requestRef = window.firebaseDb.collection('creditRequests').doc(requestId); const requestSnap = await transaction.get(requestRef);
      if (!requestSnap.exists) throw new Error('This request no longer exists.'); const request = requestSnap.data();
      if (request.status !== 'pending') throw new Error('This request has already been reviewed.');
      if (!Number.isInteger(request.amount) || request.amount < 100 || !request.uid) throw new Error('The request data is invalid.');
      const userRef = window.firebaseDb.collection('users').doc(request.uid); const userSnap = await transaction.get(userRef);
      if (!userSnap.exists) throw new Error('The user profile could not be found; no credits were added.');
      const currentCredits = Number(userSnap.data().credits || 0); if (!Number.isFinite(currentCredits) || currentCredits < 0) throw new Error('The current credit balance is invalid.');
      transaction.update(userRef, { credits: currentCredits + request.amount, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      transaction.update(requestRef, { status: 'approved', reviewedAt: firebase.firestore.FieldValue.serverTimestamp(), reviewedBy: user.uid });
    }); const requestDoc = await window.firebaseDb.collection('creditRequests').doc(requestId).get(); const requestData = requestDoc.data(); if(requestData?.uid) await notifyUser(requestData.uid,'Credits approved',String(requestData.amount)+' credits have been added to your balance.'); showToast('Request approved and credits added once.', 'success');
  } catch (error) { console.error('Credit approval failed:', error); if (String(error.message || '').includes('already been reviewed')) showToast('This request has already been reviewed. The balance was not changed again.', 'info', 'Already processed'); else showToast(error.message || 'Could not approve this request.', 'error', 'Approval failed'); }
  finally { window.__creditActionBusy = false; }
}

async function rejectCreditRequest(requestId) {
  if (window.__creditActionBusy) { showToast('A credit request action is already processing. Please wait.', 'info'); return; }
  window.__creditActionBusy = true;
  const user = window.firebaseAuth.currentUser; if (!user) { showToast('Sign in with the administrator account first.', 'error'); return; }
  try { const token = await user.getIdTokenResult(true); if (token.claims.admin !== true) throw new Error('Administrator permission is required.'); const ref = window.firebaseDb.collection('creditRequests').doc(requestId);
    await window.firebaseDb.runTransaction(async transaction => { const snap = await transaction.get(ref); if (!snap.exists) throw new Error('This request no longer exists.'); if (snap.data().status !== 'pending') throw new Error('This request has already been reviewed.'); transaction.update(ref, { status: 'rejected', reviewedAt: firebase.firestore.FieldValue.serverTimestamp(), reviewedBy: user.uid }); });
    const rejected = await ref.get(); const rejectedData = rejected.data(); if(rejectedData?.uid) await notifyUser(rejectedData.uid,'Credit request rejected','Your credit request was rejected. Please contact support if you need help.'); showToast('Credit request rejected. No credits were added.', 'success');
  } catch (error) { console.error('Credit rejection failed:', error); if (String(error.message || '').includes('already been reviewed')) showToast('This request has already been reviewed.', 'info', 'Already processed'); else showToast(error.message || 'Could not reject this request.', 'error', 'Rejection failed'); }
  finally { window.__creditActionBusy = false; }
}

async function adminUserAction(uid,type){try{await assertAdmin();const ref=window.firebaseDb.collection('users').doc(uid),snap=await ref.get();if(!snap.exists)throw new Error('User profile not found.');if(type==='delete'){if(!confirm('Delete this Firestore profile? This does not delete the Firebase Authentication account.'))return;await ref.delete();showToast('Profile deleted. Auth account remains and must be deleted separately.','warning');return;}let patch={},title='Account updated',desc='An administrator updated your account.';if(type==='ban'){patch={accountStatus:'banned'};title='Account banned';desc='An administrator banned your account.';}if(type==='unban'){patch={accountStatus:'active'};title='Account restored';desc='Your account access was restored.';}if(type==='restrict'){patch={accountStatus:'restricted',customLimits:{messagesPerDay:20}};title='Account restricted';desc='An administrator restricted your account.';}if(type==='unrestrict'){patch={accountStatus:'active',customLimits:null};title='Restrictions removed';desc='Your restrictions were removed.';}if(type==='plan'){patch.plan=document.getElementById('plan-override-select').value;title='Plan updated';desc='Your plan is now '+patch.plan+'.';}if(type==='limit'){const n=parseInt(document.getElementById('limit-input').value,10)||0;patch.customLimits=n>0?{messagesPerDay:n}:null;title='Usage limit updated';desc=n>0?'Daily limit set to '+n+'.':'Custom limit removed.';}await ref.update({...patch,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await notifyUser(uid,title,desc);showToast('User record updated.','success');}catch(e){console.error(e);showToast(e.message||'Could not update user.','error');}}

function navigateTo(view) {
  const requiresAuth = ['user-chat', 'user-all-chats', 'user-coder', 'user-profile', 'user-plans', 'user-settings', 'user-help', 'user-api-keys', 'user-api-docs', 'user-projects', 'user-community', 'user-create'];
  if (requiresAuth.includes(view) && state.userEmail === '') { state.showAuthModal = true; state.authMode = 'signin'; render(); return; }
  state.currentView = view;
  render();
  setTimeout(() => { const el = document.getElementById('chat-messages') || document.getElementById('admin-chat-messages'); if (el) el.scrollTop = el.scrollHeight; }, 50);
}

function openAuthModal(mode) { state.authMode = mode || 'signin'; state.showAuthModal = true; render(); }
function toggleAuthMode() { state.authMode = state.authMode === 'signin' ? 'signup' : 'signin'; render(); }

async function signInWithGoogle() {
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await window.firebaseAuth.signInWithPopup(provider);
    closeModal();
    state.currentView = 'user-chat';
    render();
    showToast('Signed in successfully with Google!', 'success', 'Welcome back');
  } catch (error) {
    console.error('Google sign-in failed:', error);
    showToast(error.message || 'Google sign-in failed. Please try again.', 'error', 'Sign-in failed');
  }
}

async function signInWithEmail() {
  const nameInput = document.getElementById('auth-name');
  const emailInput = document.getElementById('auth-email');
  const passwordInput = document.getElementById('auth-password');
  const email = emailInput ? emailInput.value.trim() : '';
  const name = nameInput ? nameInput.value.trim() : '';
  const password = passwordInput ? passwordInput.value : '';

  if (!email || !password) {
    showToast('Please enter your email and password.', 'error', 'Missing information');
    return;
  }
  if (password.length < 6) {
    showToast('Password must be at least 6 characters.', 'error', 'Invalid password');
    return;
  }

  try {
    if (state.authMode === 'signup') {
      if (!name) {
        showToast('Please enter your name.', 'error', 'Missing name');
        return;
      }
      const credential = await window.firebaseAuth.createUserWithEmailAndPassword(email, password);
      await credential.user.updateProfile({ displayName: name });
    } else {
      await window.firebaseAuth.signInWithEmailAndPassword(email, password);
    }
    closeModal();
    state.currentView = 'user-chat';
    render();
    showToast(state.authMode === 'signup' ? 'Account created successfully.' : 'Welcome back!', 'success');
  } catch (error) {
    console.error('Email authentication failed:', error);
    const messages = {
      'auth/email-already-in-use': 'An account already exists for this email.',
      'auth/invalid-email': 'Please check the email address.',
      'auth/invalid-credential': 'Email or password is incorrect.',
      'auth/weak-password': 'Choose a stronger password (at least 6 characters).',
      'auth/popup-closed-by-user': 'The Google sign-in window was closed.'
    };
    showToast(messages[error.code] || error.message || 'Authentication failed.', 'error', 'Sign-in failed');
  }
}

async function signOut() {
  try {

async function sendMessage() {
  const input = document.getElementById('user-message-input');
  if (!input || !input.value.trim()) return;
  const user = window.firebaseAuth.currentUser;
  if (!user) { showToast('Please sign in before chatting with AI.', 'warning'); openAuthModal('signin'); return; }
  const content = input.value.trim();
  try { const profileSnap = await window.firebaseDb.collection('users').doc(user.uid).get(); const profile = profileSnap.data() || {}; state.currentUserProfile = profile; if (profile.accountStatus === 'banned') { showToast('Your account is banned. Contact support.', 'error'); return; } const limit = Number(profile.customLimits?.messagesPerDay || 0); if (profile.accountStatus === 'restricted' && limit > 0 && state.messagesToday >= limit) { showToast('Your account has reached its daily message limit.', 'warning'); return; } } catch (e) { showToast('Could not verify account status. Try again.', 'error'); return; }
  state.newMessage = '';

    const previousMessages = state.chatMessages.map(message => ({ role: message.role, content: message.content }));
    await saveChatMessage(chatId, 'user', content);
    state.messagesToday++;
    const messages = [...previousMessages, { role: 'user', content }].slice(-12).map(message => ({
      role: (message.role === 'ai' || message.role === 'human') ? 'assistant' : message.role,
      content: message.content
    }));
    const token = await user.getIdToken();
    const controller = new AbortController();
    const requestTimeout = setTimeout(() => controller.abort(), 45000);
    let response;
    try {
      response = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ messages }),
        signal: controller.signal
      });
    } catch (requestError) {
      if (requestError.name === 'AbortError') throw new Error('The AI is taking too long to respond. Please try again.');
      throw requestError;
    } finally {
      clearTimeout(requestTimeout);
    }
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'The AI request failed.');
    await saveChatMessage(chatId, 'ai', data.reply);
    state.apiCalls++;
  } catch (error) {
    console.error('Chat request failed:', error);
    showToast(error.message || 'Could not save your message or get an AI response.', 'error', 'Chat failed');
  } finally {
    state.isTyping = false;
    render();
    const el = document.getElementById('chat-messages');
    if (el) el.scrollTop = el.scrollHeight;
  }
}

    }
    try {
      state.messageFeedback = {};
      try {
        const feedbackSnap = await window.firebaseDb.collection('users').doc(user.uid).collection('feedback').get();
        feedbackSnap.forEach(doc => { state.messageFeedback[doc.id] = doc.data().rating; });
      } catch (feedbackError) { console.warn('Could not load saved feedback', feedbackError); }
      const usageDay = new Date().toISOString().slice(0, 10);
      try {
        const usageSnap = await window.firebaseDb.collection('users').doc(user.uid).collection('usage').doc(usageDay).get();
        const usage = usageSnap.data() || {};
        state.messagesToday = Number(usage.messageCount || 0);
        state.apiCalls = Number(usage.apiCalls || 0);
      } catch (usageError) { console.warn('Could not load daily usage', usageError); }
      const profileRef = window.firebaseDb.collection('users').doc(user.uid);
      const profileSnap = await profileRef.get();
      if (!profileSnap.exists) {
        await profileRef.set({ uid: user.uid, email: user.email || '', displayName: state.userName, plan: 'free', credits: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp(), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        state.currentPlan = 'free'; state.totalBalance = 0; state.currentUserProfile = {uid:user.uid,plan:'free',credits:0,accountStatus:'active'};
      } else {
        const profile = profileSnap.data() || {}; state.currentUserProfile = profile;
        if (profile.accountStatus === 'banned') { showToast('This account is banned. Contact support.', 'error', 'Account disabled'); state.profileLoaded = true; }
        state.currentPlan = ['free','pro','enterprise'].includes(profile.plan) ? profile.plan : 'free';
        state.totalBalance = Number.isFinite(profile.credits) ? profile.credits : 0;
        state.memberSince = profile.createdAt && profile.createdAt.toDate ? profile.createdAt.toDate().toLocaleDateString('en-US',{month:'short',year:'numeric'}) : state.memberSince;
      }
      state.profileLoaded = true;
      if (state.chatsUnsubscribe) state.chatsUnsubscribe();
      state.chatsUnsubscribe = window.firebaseDb.collection('users').doc(user.uid).collection('chats').orderBy('updatedAt','desc').onSnapshot(snapshot => {
        state.userChats = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        state.totalChats = state.userChats.length;
        if (!state.currentChatId && state.userChats.length) {
          loadChatMessages(state.userChats[0].id);
        } else {
          render();
        }
      }, error => { console.error('Chat list listener failed:', error); showToast('Could not load saved chats. Check Firestore rules.', 'error'); });
    } catch (error) { console.error('Could not load profile:', error); showToast('Account data could not be loaded. Check Firestore setup and rules.', 'error'); }
    if(state.notificationsUnsubscribe)state.notificationsUnsubscribe();state.notificationsUnsubscribe=window.firebaseDb.collection('users').doc(user.uid).collection('notifications').orderBy('createdAt','desc').limit(30).onSnapshot(snap=>{state.userNotifications=snap.docs.map(d=>({...d.data(),id:d.id}));state.notifications=state.userNotifications.filter(n=>n.unread).length;render();},e=>console.warn('Notifications listener failed',e));
    if (state.currentView === 'landing') state.currentView = 'user-chat';
  } else {
    state.userName = '';
    state.userEmail = '';
    state.userAvatar = '';
    state.userProvider = '';
    state.currentChatId = null; state.chatMessages = []; state.userChats = []; state.totalChats = 0; state.totalBalance = 0; state.currentPlan = 'free'; state.profileLoaded = false;
    if (state.chatsUnsubscribe) { state.chatsUnsubscribe(); state.chatsUnsubscribe = null; }
    if (state.messagesUnsubscribe) { state.messagesUnsubscribe(); state.messagesUnsubscribe = null; }
    state.isAdminUser = false;
    state.currentRole = 'user';
    if (state.currentView !== 'admin-login') state.currentView = 'landing';
  }
  render();
});
</script>
</body>
</html>
